[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgechem"
version = "0.1.0"
description = "Exploratory particle simulations for teaching physical chemistry, bridging the microscopic, macroscopic and symbolic levels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bridgechem contributors" }]
keywords = ["chemistry", "physics", "molecular-dynamics", "education", "simulation"]
classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.4",
    "ipython>=7.0",
    "ipywidgets>=7.0",
    "numba>=0.56",
    "ipympl>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["bridgechem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
